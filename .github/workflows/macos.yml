name: macOS build and tests
on:
  push:
    paths:
      - 'app/Sources/**'
      - 'app/Tests/**'
      - 'app/UITests/**'
      - 'app/Resources/**'
      - 'app/PoochiAnalytics.xcodeproj/**'
      - 'app/Package.swift'
      - 'app/scripts/**'
      - 'app/*.command'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests and universal macOS app
        run: bash scripts/build.sh
      - name: Native sample-data UI smoke test
        run: |
          xcodebuild -project PoochiAnalytics.xcodeproj -scheme PoochiAnalytics \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath build-ui \
            -resultBundlePath build/Poochi-UI.xcresult CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual test
      - name: Export native UI screenshots
        if: always()
        run: |
          if [ -d build/Poochi-UI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Poochi-UI.xcresult --output-path build/ui-screenshots
          fi
      - name: App for local testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Poochi-Analytics-macOS
          path: app/build/deliverables/Poochi-Analytics-macOS.zip
          if-no-files-found: ignore
          retention-days: 14
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Poochi-test-results
          path: |
            app/build/Poochi-UI.xcresult
            app/build/ui-screenshots
          if-no-files-found: ignore
          retention-days: 14
